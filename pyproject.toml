[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-shield"
version = "0.1.0"
description = "Local trust scanner for AI-built and downloaded software."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/BlockhouseSoftware/ai-shield"
Source = "https://github.com/BlockhouseSoftware/ai-shield"
Issues = "https://github.com/BlockhouseSoftware/ai-shield/issues"

[project.scripts]
aishield = "aishield.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aishield*"]
