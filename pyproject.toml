[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trojaino"
version = "0.1.3"
description = "Local deterministic install gate for AI tools and downloaded software."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://trojaino.com"
Source = "https://github.com/BlockhouseSoftware/trojaino"
Issues = "https://github.com/BlockhouseSoftware/trojaino/issues"

[project.scripts]
trojaino = "aishield.cli:main"
aishield = "aishield.cli:main"  # Legacy CLI alias; use trojaino in new scripts.

[tool.setuptools.packages.find]
where = ["."]
include = ["aishield*", "trojaino*"]
