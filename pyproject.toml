[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trojaino"
version = "0.1.4.1"
description = "Local trust scanner for AI-built and downloaded software."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/BlockhouseSoftware/trojaino"
Source = "https://github.com/BlockhouseSoftware/trojaino"
Issues = "https://github.com/BlockhouseSoftware/trojaino/issues"

[project.scripts]
tjscan = "trojaino.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trojaino*"]
