name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution from the tag
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist
          python -m twine check dist/*
      - name: Verify artifact contents and metadata
        run: |
          python scripts/verify_distribution.py \
            --dist dist \
            --version "${GITHUB_REF_NAME#v}"
      - name: Smoke-test the wheel in a fresh environment
        run: |
          python scripts/smoke_installed_wheel.py \
            --wheel dist \
            --clean tests/fixtures/clean-project \
            --risky tests/fixtures/bad-node-app
      - uses: actions/upload-artifact@v7
        with:
          name: trojaino-pypi-distributions-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish verified distributions
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/trojaino/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: trojaino-pypi-distributions-${{ github.ref_name }}
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
