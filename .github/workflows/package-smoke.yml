name: Package smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "trojaino/**"
      - "scripts/smoke_installed_wheel.py"
      - "tests/fixtures/**"
      - ".github/workflows/package-smoke.yml"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "LICENSE"
  push:
    branches:
      - "loop/**"
    paths:
      - "trojaino/**"
      - "scripts/smoke_installed_wheel.py"
      - "tests/fixtures/**"
      - ".github/workflows/package-smoke.yml"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "LICENSE"

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the distribution wheel once
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: trojaino-wheel
          path: dist/*.whl
          if-no-files-found: error

  smoke-installed-wheel:
    name: Package smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v7
        with:
          name: trojaino-wheel
          path: wheel
      - name: Install the wheel in a fresh environment and smoke-test tjscan
        run: >-
          python scripts/smoke_installed_wheel.py
          --wheel wheel
          --clean tests/fixtures/clean-project
          --risky tests/fixtures/bad-node-app
