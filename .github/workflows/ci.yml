name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject internal and local-only artifacts
        run: python scripts/check_repository_boundary.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run release-profile self-scan
        run: |
          python -m aishield scan . --profile release --json > "$RUNNER_TEMP/aishield-release.json"
          python -c 'import json, os, pathlib; report=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "aishield-release.json").read_text()); assert report["verdict"] == "NO CRITICAL RISKS FOUND"; assert {"verdict", "findings", "capabilities"} <= report.keys()'