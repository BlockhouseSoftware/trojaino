name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-boundary:
    name: Repository boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Reject internal and local-only artifacts
        run: python scripts/check_repository_boundary.py

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install . -r requirements/test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run release-profile self-scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if python -m trojaino scan . --profile release --json > "$RUNNER_TEMP/trojaino-release.json"; then
            scan_rc=0
          else
            scan_rc=$?
          fi
          if [ "$scan_rc" -ne 0 ] && [ "$scan_rc" -ne 2 ]; then
            exit "$scan_rc"
          fi
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "unable to establish a trusted base revision" >&2
            exit 1
          fi
          args=(--report "$RUNNER_TEMP/trojaino-release.json" --baseline .github/release-self-scan-baseline.json --root . --changed-from "$BASE_SHA")
          python scripts/check_release_self_scan.py "${args[@]}"