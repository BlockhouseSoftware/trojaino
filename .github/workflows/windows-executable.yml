name: Windows executable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "trojaino/**"
      - "requirements/windows-build.txt"
      - "scripts/build_windows_executable.py"
      - ".github/workflows/windows-executable.yml"
      - "pyproject.toml"
  push:
    branches:
      - "loop/**"
    paths:
      - "trojaino/**"
      - "requirements/windows-build.txt"
      - "scripts/build_windows_executable.py"
      - ".github/workflows/windows-executable.yml"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  build-windows-executable:
    name: Build and smoke-test tjscan.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Trojaino and Windows build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install -r requirements/windows-build.txt
      - name: Build standalone executable
        shell: pwsh
        run: |
          python scripts/build_windows_executable.py `
            --distpath "$env:RUNNER_TEMP/trojaino-dist" `
            --workpath "$env:RUNNER_TEMP/trojaino-build" `
            --specpath "$env:RUNNER_TEMP/trojaino-spec"
      - name: Smoke-test standalone executable
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP/trojaino-dist/tjscan/tjscan.exe"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"

          $cleanOutput = & $exe scan tests/fixtures/clean-project
          $cleanText = $cleanOutput -join "`n"
          Write-Host $cleanText
          if ($LASTEXITCODE -ne 0) {
            throw "Clean fixture returned exit code $LASTEXITCODE"
          }
          if ($cleanText -notmatch "Trojaino v$version") {
            throw "Standalone executable did not report canonical version $version"
          }

          & $exe scan tests/fixtures/bad-node-app
          if ($LASTEXITCODE -ne 2) {
            throw "Risky fixture returned exit code $LASTEXITCODE; expected 2"
          }

          # PowerShell otherwise propagates tjscan's expected risk exit code (2)
          # as the step's failure status after this assertion has passed.
          exit 0
      - uses: actions/upload-artifact@v7
        with:
          name: tjscan-windows-standalone
          path: ${{ runner.temp }}/trojaino-dist/tjscan
          if-no-files-found: error
