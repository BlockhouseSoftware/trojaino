name: Install gate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run billable authenticated Claude sessions (requires explicit approval)
        type: boolean
        default: false
      public_install:
        description: Verify the public catalog after promoting this release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run the test suite
        run: |
          python -m pip install . -r requirements/test.txt
          python -m unittest discover -s tests -v

  native-runtime:
    name: Python prerequisites / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: old-python
        with:
          python-version: "3.10"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Exercise absent, unsupported and supported runtimes
        env:
          TROJAINO_OLD_PYTHON: ${{ steps.old-python.outputs.python-path }}
        run: python -m unittest discover -s tests -p test_native_launcher.py -v

  plugin-smoke:
    name: Plugin install / ${{ matrix.os }} / Claude ${{ matrix.claude }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        claude: ["2.1.274", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $alias = Join-Path (Split-Path $python) 'python3.exe'
          if (-not (Test-Path $alias)) { Copy-Item $python $alias }
      - name: Install supported Claude Code version
        shell: bash
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - name: Verify native readiness errors through the actual Claude host
        env:
          TROJAINO_TEST_CLAUDE: "1"
        run: python -m unittest discover -s tests -p test_native_launcher.py -v
      - name: Exercise candidate install, update, readiness and migration
        run: python scripts/smoke_plugin_install.py
      - name: Install the pushed candidate through the production GitHub source type
        env:
          TROJAINO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/smoke_plugin_install.py --candidate-git
      - name: Verify the public release installation
        if: github.event_name == 'workflow_dispatch' && inputs.public_install
        run: python scripts/smoke_plugin_install.py --public

  live:
    # A real Claude Code session, with the plugin installed the way users install
    # it, against the real npm and PyPI registries. Needs the ANTHROPIC_API_KEY
    # repository secret; without it the job is skipped, never faked.
    name: Live Claude session / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUTF8: "1"
    # Manual and separately opted in: ordinary platform/public-catalog diagnostics
    # must not launch billable model sessions. Enable run_live only after approval.
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    steps:
      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        shell: bash
        run: echo "::notice::ANTHROPIC_API_KEY is not set; the live Claude session was not run."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: env.ANTHROPIC_API_KEY != ''
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: env.ANTHROPIC_API_KEY != ''
        with:
          python-version: "3.12"
      - name: Provide python3 on Windows as the Python Install Manager does
        if: env.ANTHROPIC_API_KEY != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $python3 = Join-Path (Split-Path $python) 'python3.exe'
          if (-not (Test-Path $python3)) {
            Copy-Item $python $python3
          }
          python3 --version
      - name: Install Claude Code
        if: env.ANTHROPIC_API_KEY != ''
        shell: bash
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version
      - name: Install Trojaino with the two plugin commands
        if: env.ANTHROPIC_API_KEY != ''
        shell: bash
        run: |
          market="$RUNNER_TEMP/market"
          mkdir -p "$market/.claude-plugin"
          cp -r plugins/trojaino "$market/trojaino"
          printf '%s' '{"name":"blockhouse-ci","owner":{"name":"ci"},"plugins":[{"name":"trojaino","source":"./trojaino","description":"install gate"}]}' > "$market/.claude-plugin/marketplace.json"
          claude plugin marketplace add "$market"
          claude plugin install trojaino@blockhouse-ci --scope user
          claude plugin list
      - name: Run real sessions through the gate
        if: env.ANTHROPIC_API_KEY != ''
        shell: bash
        run: python scripts/live_gate_check.py

  windows11-arm-smoke:
    # Supplemental OS evidence, not x64 or ordinary-user/visual acceptance.
    # Standard public-repository runner; no model sessions or API credentials.
    name: Windows 11 ARM platform / model-free
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Verify Windows client and native ARM Python
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($os.ProductType -ne 1 -or $os.Caption -notmatch 'Windows 11' -or $arch -ne 'Arm64') {
            throw 'This probe requires Windows 11 client on ARM64, not Server or emulated x64 OS evidence'
          }
          [ordered]@{sha=$env:GITHUB_SHA; caption=$os.Caption; version=$os.Version; architecture=$arch; qualification='hosted Windows11 ARM only; not x64 or human installation acceptance'} | ConvertTo-Json -Compress
          python -c "import platform,sys; print({'python':sys.version.split()[0],'machine':platform.machine()}); assert platform.machine().lower()=='arm64'"
          if ($LASTEXITCODE -ne 0) { throw 'Python is not native ARM64' }
          $python = (Get-Command python).Source
          $alias = Join-Path (Split-Path $python) 'python3.exe'
          if (-not (Test-Path $alias)) { Copy-Item $python $alias }
      - name: Run unit tests on Windows 11 ARM
        run: |
          python -m pip install . -r requirements/test.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency installation failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows11 unit tests failed' }
      - name: Install Claude CLI without starting a model session
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          if ($LASTEXITCODE -ne 0) { throw 'Claude CLI installation failed' }
          claude --version
          if ($LASTEXITCODE -ne 0) { throw 'Claude CLI version probe failed' }
          node -p "JSON.stringify({node:process.version,architecture:process.arch})"
          if ($LASTEXITCODE -ne 0) { throw 'Node architecture probe failed' }
      - name: Exercise Windows 11 candidate lifecycle
        env:
          TROJAINO_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python scripts/smoke_plugin_install.py --candidate-git
          if ($LASTEXITCODE -ne 0) { throw 'Windows11 candidate lifecycle failed' }
      - name: Exercise Windows 11 public release lifecycle
        if: inputs.public_install
        run: |
          python scripts/smoke_plugin_install.py --public
          if ($LASTEXITCODE -ne 0) { throw 'Windows11 public lifecycle failed' }
