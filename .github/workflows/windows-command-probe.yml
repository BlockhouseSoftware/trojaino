name: Windows command lookup investigation
on:
  push:
    branches: ["ci/windows-install-diagnostics"]
    paths:
      - "tests/native_command_lookup_probe.py"
      - ".github/workflows/windows-command-probe.yml"
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Observe absent-command lookup without changing product code
        run: python tests/native_command_lookup_probe.py
